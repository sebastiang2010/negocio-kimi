# Copiar a config.yaml y completar.
bot_token: "PEGAR_TOKEN_DE_BOTFATHER"

# user_ids numéricos de administradores (usar @userinfobot para conocer el tuyo)
admin_ids: []

moderation:
  # mensajes por intervalo antes de considerar spam
  rate_limit_messages: 5
  rate_limit_window_sec: 10

  # palabras/frases prohibidas (minúsculas, substring match)
  banned_phrases:
    - "airdrop gratis"
    - "dm me for"
    - "double your"

  # dominios de links permitidos (vacío = bloquea TODOS los links de no-admins)
  allowed_link_domains:
    - "t.me"
    - "github.com"

  action: "delete_and_warn"   # delete_and_warn | mute | ban
  mute_minutes: 60
  warn_threshold: 3            # warns antes de ban

faq:
  enabled: true
  # usar LLM local (Ollama) para respuestas libres; requiere ollama corriendo
  use_llm: false
  ollama_model: "llama3.1:8b"
  ollama_url: "http://localhost:11434"

  # base de conocimiento: pregunta-clave -> respuesta
  entries:
    - keywords: ["contrato", "contract", "token address", "direccion"]
      answer: "El contrato oficial se publica solo en el canal de anuncios. Nunca lo pedimos por DM."
    - keywords: ["roadmap", "hoja de ruta"]
      answer: "El roadmap actualizado está en el mensaje fijado del grupo."
    - keywords: ["precio", "price", "cuando sube"]
      answer: "No discutimos precio ni damos consejos financieros. Esto es una comunidad técnica."

logging:
  file: "logs/events.jsonl"

announce:
  enabled: true
